<style>
#oys-calc-v9,#oys-calc-v9 *{box-sizing:border-box}
#oys-calc-v9{--navy:#0B2545;--teal:#83E0DC;--blue:#5AA1C9;--green:#188065;--ink:#36536a;--line:#e1ebf2;--soft:#f5f9fc;
max-width:1150px;margin:0 auto;background:#fff;color:var(--navy);border:1px solid #d9e7ee;border-radius:24px;overflow:hidden;font-family:Poppins,Arial,sans-serif;box-shadow:0 18px 50px #0b254518}
/* Encabezado */
#oys-calc-v9 .oys-head{position:relative;padding:34px 32px;color:#fff;background:radial-gradient(circle at 92% 0,#83e0dc55,transparent 45%),linear-gradient(120deg,#0B2545,#13406b)}
#oys-calc-v9 .oys-head span{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.12em;color:var(--teal);background:#ffffff14;border:1px solid #83e0dc55;padding:5px 12px;border-radius:999px}
#oys-calc-v9 h2{font-size:28px;font-weight:700;line-height:1.25;margin:14px 0 8px!important;color:#fff}
#oys-calc-v9 .oys-head p{font-size:13px;line-height:1.6;color:#c6d9e8;margin:0;max-width:680px}
/* Layout */
#oys-calc-v9 .oys-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;padding:28px;background:var(--soft)}
#oys-calc-v9 .oys-form{display:grid;gap:16px;align-content:start;background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:0 4px 18px #0b25450a}
#oys-calc-v9 h3{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700;color:var(--navy);margin:14px 0 0!important;padding-top:0}
#oys-calc-v9 h3:before{content:"";width:4px;height:18px;border-radius:4px;background:linear-gradient(var(--teal),var(--blue))}
#oys-calc-v9 .oys-form>h3:first-child{margin-top:0!important}
#oys-calc-v9 label{font-size:12px;font-weight:600;display:grid;gap:7px;color:var(--ink)}
#oys-calc-v9 input,#oys-calc-v9 select{font-family:inherit;font-size:14px;color:var(--navy);background:var(--soft);border:1.5px solid #d3e1ea;border-radius:11px;min-width:0;width:100%;padding:11px 13px;height:46px;transition:border-color .15s,box-shadow .15s,background .15s}
#oys-calc-v9 input:hover,#oys-calc-v9 select:hover{border-color:var(--blue)}
#oys-calc-v9 input:focus,#oys-calc-v9 select:focus{outline:0;background:#fff;border-color:var(--blue);box-shadow:0 0 0 4px #83e0dc55}
#oys-calc-v9 small{font-weight:400;font-size:11px;line-height:1.5;color:#688296}
#oys-calc-v9 .oys-two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#oys-calc-v9 .oys-note{font-size:11px;color:#607d91;line-height:1.65;margin:0}
#oys-calc-v9 .oys-vat-note{font-size:12px;line-height:1.6;color:#244e66;background:#e7f3f8;border-left:3px solid var(--blue);padding:11px 13px;border-radius:0 8px 8px 0;margin:6px 0}
/* Panel de resultados */
#oys-calc-v9 .oys-results{border:1px solid var(--line);border-radius:18px;background:#fff;padding:25px;align-self:start;position:sticky;top:15px;overflow:hidden;box-shadow:0 10px 30px #0b254512}
#oys-calc-v9 .oys-overline{display:block;margin:-25px -25px 0;padding:24px 25px 0;background:var(--navy);color:var(--teal);font-size:11px;font-weight:600;letter-spacing:.12em}
#oys-calc-v9 .oys-price{margin:0 -25px;padding:6px 25px 4px;background:var(--navy);color:#9af2d3;font-size:42px;font-weight:700;line-height:1.2;letter-spacing:-.01em}
#oys-calc-v9 .oys-sub{margin:0 -25px 18px;padding:0 25px 22px;background:var(--navy);color:#b8cfe0;font-size:12px;line-height:1.5}
#oys-calc-v9 .oys-line{display:flex;align-items:baseline;justify-content:space-between;gap:18px;border-bottom:1px solid var(--line);padding:10px 4px;font-size:12px;transition:background .15s}
#oys-calc-v9 .oys-line:hover{background:var(--soft)}
#oys-calc-v9 .oys-line span{color:#48677d;flex:1}
#oys-calc-v9 .oys-line strong{font-size:13px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
#oys-calc-v9 .oys-highlight,#oys-calc-v9 .oys-highlight:hover{background:#e6f7f1;border:0;border-left:4px solid var(--green);border-radius:8px;padding:12px 12px;margin:6px 0}
#oys-calc-v9 .oys-highlight strong{color:var(--green);font-size:14px}
/* Botones */
#oys-calc-v9 button{font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;border:0;border-radius:12px;padding:13px 18px;transition:transform .15s,box-shadow .15s,background .15s}
#oys-calc-v9 button:hover{transform:translateY(-1px)}
#oys-calc-v9 button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
#oys-calc-v9 .oys-copy{background:linear-gradient(120deg,#0B2545,#13406b);color:#fff;width:100%;margin-top:18px;box-shadow:0 6px 16px #0b254533}
#oys-calc-v9 .oys-reset{background:#fff;color:var(--navy);border:1.5px solid #cfe0ea;margin-top:6px}
#oys-calc-v9 .oys-reset:hover{background:#e5f4f6}
/* Tabla */
#oys-calc-v9 .oys-table-scroll{overflow-x:auto;margin:14px 0;border:1px solid var(--line);border-radius:12px}
#oys-calc-v9 .oys-table{border-collapse:collapse;width:100%;min-width:520px;font-size:11.5px;font-variant-numeric:tabular-nums}
#oys-calc-v9 .oys-table th,#oys-calc-v9 .oys-table td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
#oys-calc-v9 .oys-table th:first-child,#oys-calc-v9 .oys-table td:first-child{text-align:left}
#oys-calc-v9 .oys-table thead th{background:var(--navy);color:#e3eef6;font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
#oys-calc-v9 .oys-table tbody tr:nth-child(even){background:var(--soft)}
#oys-calc-v9 .oys-table tbody tr:last-child td{border-bottom:0}
#oys-calc-v9 .oys-table tr.oys-baseline td:first-child{font-weight:700}
#oys-calc-v9 .oys-table tr.oys-selected{background:#dff4ef;font-weight:700;color:var(--green)}
#oys-calc-v9 .oys-table tr.oys-selected td:first-child{box-shadow:inset 4px 0 0 var(--green)}
#oys-calc-v9 .oys-insight{padding:14px 16px;border-radius:12px;background:#e9f5fa;border-left:4px solid var(--blue);font-size:12px;line-height:1.65;color:var(--navy);margin:12px 0}
/* Pie */
#oys-calc-v9 footer{padding:18px 28px 26px;color:#71899a;font-size:11px;line-height:1.7;background:#fff;border-top:1px solid var(--line)}
/* Responsive */
@media(max-width:780px){#oys-calc-v9 .oys-grid{grid-template-columns:1fr;padding:16px;gap:18px}#oys-calc-v9 .oys-form{padding:20px}#oys-calc-v9 .oys-results{position:static}#oys-calc-v9 .oys-head{padding:24px 20px}#oys-calc-v9 h2{font-size:23px}#oys-calc-v9 .oys-price{font-size:33px}}
@media(max-width:420px){#oys-calc-v9 .oys-two{grid-template-columns:1fr}#oys-calc-v9 .oys-line{font-size:11px}}
</style>
